[package]
name = "engine-wasm"       # 임시명 — engine 과 함께 R6(네이밍)에서 확정
version = "0.0.1"
edition = "2021"
license = "MIT"
# 아래 두 필드는 wasm-pack 이 생성하는 package.json 으로 흘러들어간다
description = "GDAL-free Cloud-Optimized GeoTIFF reader for the browser (duckdb-cog engine sidecar)"
repository = "https://github.com/st-layer/duckdb-cog"

# wasm-pack 동봉 wasm-opt(구형 binaryen)가 최신 rustc 출력 검증에 실패
# ("Fatal: error validating input") — 비활성화. 크기 최적화가 필요해지면
# 최신 binaryen 을 별도 단계로 도입한다.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
# cdylib = wasm-pack 산출물, rlib = wasm-bindgen-test 테스트 크레이트 링크용
crate-type = ["cdylib", "rlib"]

# 의존성 전부 wasm 전용 — 네이티브 워크스페이스 빌드(just check)에서는 빈
# 크레이트가 되어 판정 무영향. 실제 판정은 just wasm-check / wasm-test.
[target.'cfg(target_arch = "wasm32")'.dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# fetch 경로 (#66 슬라이스 2) — Request/Response + Range 헤더
web-sys = { version = "0.3", features = ["Headers", "Request", "Response", "Window"] }
# 패닉 메시지를 브라우저 console 로 — 사이드카 디버깅 필수품
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
